<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog - PDF Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Product Catalog</h1>
        <p>View our product catalog in PDF format</p>
    </header>
    
    <main>
        <div class="pdf-container">
            <embed src="catalog.pdf" type="application/pdf" width="100%" height="100%" aria-label="Product catalog PDF viewer">
                <p class="pdf-fallback">
                    Your browser does not support embedded PDFs. 
                    <a href="catalog.pdf" download>Download the PDF</a> to view it.
                </p>
            </embed>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2025 Product Catalog. All rights reserved.</p>
    </footer>
</body>
</html>
